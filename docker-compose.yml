version: '3.8'

services:
  netpulse-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netpulse_server
    ports:
      - "8080:8080"
    environment:
      - NETPULSE_HOST=0.0.0.0
      - NETPULSE_PORT=8080
      - NETPULSE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
